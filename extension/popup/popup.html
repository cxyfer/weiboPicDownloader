<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weibo Pic Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="topbar">
    <h1>Weibo Pic Downloader</h1>
    <div class="status">
      <span>登入狀態：</span><strong id="login-status">檢查中...</strong>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-target="tab-new" aria-selected="true">新增任務</button>
    <button class="tab" data-target="tab-list" aria-selected="false">任務列表</button>
    <button class="tab" data-target="tab-settings" aria-selected="false">設定</button>
    <button class="tab" data-target="tab-logs" aria-selected="false">日誌</button>
  </div>

  <section id="tab-new" class="tab-panel active" role="tabpanel">
    <form id="task-form">
      <label for="url-input">微博連結或使用者/超話</label>
      <input id="url-input" name="url" type="text" placeholder="https://weibo.com/u/123456" required>

      <details class="advanced">
        <summary>進階設定</summary>
        <label class="checkbox">
          <input id="video-checkbox" type="checkbox" name="video">
          <span>同時下載影片</span>
        </label>
        <div class="field-group">
          <label>日期區間</label>
          <div class="date-range">
            <input id="date-start" type="date" name="date-start">
            <span class="separator">–</span>
            <input id="date-end" type="date" name="date-end">
          </div>
        </div>
        <label for="name-template">檔名模板</label>
        <input id="name-template" type="text" name="name-template" value="{date}_{name}">
        <small class="hint">可用欄位：{date}、{name}、{id}、{index}</small>
      </details>

      <button id="start-btn" type="submit">開始下載</button>
    </form>

    <div class="progress">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <p id="status-message" class="muted"></p>
  </section>

  <section id="tab-list" class="tab-panel" role="tabpanel">
    <div id="task-list" class="task-list">
      <p class="muted">目前沒有任務。</p>
    </div>
  </section>

  <section id="tab-settings" class="tab-panel" role="tabpanel">
    <form id="settings-form">
      <div class="field-group">
        <label for="concurrency-input">同時下載數量</label>
        <input id="concurrency-input" type="number" min="1" max="10" value="3">
        <small class="hint">建議 1-5，過高可能被微博限制</small>
      </div>
      <button type="submit" class="btn-save">儲存設定</button>
      <p id="settings-status" class="muted"></p>
    </form>
  </section>

  <section id="tab-logs" class="tab-panel" role="tabpanel">
    <div class="logs-header">
      <button id="btn-refresh-logs" class="btn ghost small">重新整理</button>
      <button id="btn-clear-logs" class="btn ghost small">清除</button>
    </div>
    <div id="logs-container" class="logs-container">
      <p class="muted">載入中...</p>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>

</html>
