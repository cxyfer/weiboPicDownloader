<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weibo Pic Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="topbar">
    <h1>Weibo Pic Downloader</h1>
    <div class="status">
      <span>登入狀態：</span><strong id="login-status">檢查中...</strong>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-target="tab-tasks" aria-selected="true">任務</button>
    <button class="tab" data-target="tab-settings" aria-selected="false">設定</button>
  </div>

  <section id="tab-tasks" class="tab-panel active" role="tabpanel">
    <form id="task-form">
      <label for="url-input">微博連結或使用者/超話</label>
      <input id="url-input" name="url" type="text" placeholder="https://weibo.com/u/123456" required>

      <details class="advanced">
        <summary>進階設定</summary>
        <label class="checkbox">
          <input id="video-checkbox" type="checkbox" name="video">
          <span>同時下載影片</span>
        </label>
      </details>

      <button id="start-btn" type="submit">開始下載</button>
    </form>

    <p id="status-message" class="muted"></p>

    <div class="divider"></div>

    <div id="task-list" class="task-list">
      <p class="muted">目前沒有任務。</p>
    </div>
  </section>

  <section id="tab-settings" class="tab-panel" role="tabpanel">
    <form id="settings-form">
      <div class="field-group">
        <label for="base-path-input">下載資料夾路徑</label>
        <input id="base-path-input" type="text" value="weiboPic">
        <small class="hint">支援巢狀路徑，如 downloads/weibo/pics</small>
      </div>

      <div class="field-group">
        <label>預設日期區間</label>
        <div class="date-range">
          <input id="date-start" type="date" name="date-start">
          <span class="separator">–</span>
          <input id="date-end" type="date" name="date-end">
        </div>
      </div>

      <div class="field-group">
        <label for="name-template-input">檔名模板</label>
        <input id="name-template-input" type="text" value="{date}_{name}">
        <small class="hint">可用欄位：{date}、{name}、{id}、{index}、{username}</small>
      </div>

      <div class="field-group">
        <label for="concurrency-input">同時下載數量</label>
        <input id="concurrency-input" type="number" min="1" max="10" value="3">
        <small class="hint">建議 1-5，過高可能被微博限制</small>
      </div>

      <div class="field-group">
        <label class="checkbox">
          <input id="auto-download-checkbox" type="checkbox" name="auto-download">
          <span>自動下載（跳過確認步驟）</span>
        </label>
      </div>

      <button type="submit" class="btn-save">儲存設定</button>
      <p id="settings-status" class="muted"></p>
    </form>
  </section>

  <script type="module" src="popup.js"></script>
</body>

</html>
